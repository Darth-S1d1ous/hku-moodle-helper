<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKU Moodle Helper</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <fieldset class="filters">
          <legend class="visually-hidden">Filters</legend>
        </fieldset>
      </aside>

      <div class="splitter">
        <button
          id="splitter"
          class="splitter-toggle"
          type="button"
          aria-label="Hide filters"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <img
            class="splitter-icon"
            src="/src/assets/icons/sidebar-toggle.svg"
            width="14"
            height="12"
            alt=""
          />
        </button>
      </div>

      <section class="board">
        <div class="toolbar">
          <label class="search">
            <span class="visually-hidden">Search todos</span>
            <input
              id="search"
              type="search"
              placeholder="Search"
              autocomplete="off"
            />
            <img
              class="search-icon"
              src="/src/assets/icons/search.svg"
              width="13.6"
              height="13.6"
              alt=""
            />
          </label>
          <button id="refresh" class="refresh" type="button" aria-label="Refresh">
            <img
              class="refresh-icon"
              src="/src/assets/icons/circular-arrow-svgrepo-com.svg"
              width="16"
              height="16"
              alt=""
            />
          </button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </div>
  </body>
</html>
